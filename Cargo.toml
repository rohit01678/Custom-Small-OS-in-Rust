[package]
name = "rust_os"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = "0.9"
uart_16550 = "0.3.2"
volatile = "=0.2.6"
spin = "0.5"
x86_64 = { version = "0.14", features = ["instructions"] }

[dependencies.lazy_static]
version = "1.4"
features = ["spin_no_std"]

[[bin]]
name = "rust_os"
test = true
bench = false

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33 
test-timeout = 300


[lints.cargo]
unused_dependencies = "allow"