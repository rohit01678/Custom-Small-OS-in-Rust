[package]
name = "rust_os"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader= "0.9.22"
volatile = "=0.2.6"
spin = "0.5.2"

[[bin]]
name = "rust_os"
test = true
bench = false

[dependencies.lazy_static]
version = "1.4.0"
features = ["spin_no_std"]

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04"]


